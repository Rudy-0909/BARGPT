<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARGPT - Steampunk Cellar</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div id="intro-overlay" onclick="startExperience()">
        <p>CLICK ANYWHERE TO ENTER BARGPT</p>
    </div>

    <div class="scene-wrapper" id="scene">

        <!-- خلفية حية: فيديو السيجارة يلف بحلقة مستمرة بدل الصورة الثابتة -->
        <video id="idleVideo" class="bg-video" autoplay loop muted playsinline poster="/bg.png">
            <source src="/videos/idle.mp4" type="video/mp4">
        </video>

        <!-- تلفاز/راديو عتيق بإطار نحاسي يعرض موسيقى الجاز -->
        <div class="retro-tv">
            <div class="retro-tv-frame">
                <div id="jazzPlayer"></div>
                <div class="retro-tv-scanlines"></div>
            </div>
            <div class="retro-tv-knob"></div>
            <div class="retro-tv-legs"></div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <span>BARGPT Archives</span>
                <button class="music-btn" id="musicToggle" onclick="toggleMusic()">🎷 Jazz: OFF</button>
            </div>
            <div id="messages"></div>
            <div class="input-box">
                <input type="text" id="userInput" placeholder="Ask Alexander..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">Send</button>
                <button onclick="startVoice()" title="Speech to text">🎙️</button>
            </div>
        </div>

        <!-- شاشة تصعيد: لعبة تصويب ثابتة (Shooting Gallery) -->
        <div class="escalation-overlay" id="escalationOverlay">
            <div class="escalation-hud">
                <div class="escalation-health">
                    <span>HEALTH</span>
                    <div class="health-bar"><div class="health-fill" id="healthFill"></div></div>
                </div>
                <div class="escalation-score">SCORE: <span id="scoreValue">0</span></div>
                <div class="escalation-timer" id="escalationTimer">25</div>
            </div>
            <canvas id="shooterCanvas"></canvas>
            <div class="shotgun-icon">
                <svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
                    <rect x="10" y="24" width="120" height="10" rx="2" fill="#3a2517"/>
                    <rect x="115" y="18" width="70" height="8" rx="2" fill="#5a422d"/>
                    <rect x="20" y="34" width="18" height="20" fill="#2a1c10"/>
                    <rect x="40" y="34" width="14" height="14" fill="#2a1c10"/>
                    <rect x="175" y="14" width="10" height="18" fill="#1a1108"/>
                </svg>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <!-- مكان جاهز للإعلانات — الصق هنا كود Google AdSense بعد ما توافق عليك (انظر التعليقات بالأسفل) -->
        <div id="adSlot" class="ad-slot">
            <!--
                بعد ما تنوافق على حسابك بـ Google AdSense، الصق كود الوحدة الإعلانية هنا مباشرة، مثال:

                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-XXXXXXXXXXXXXXX"
                     data-ad-slot="XXXXXXXXXX"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

                ولازم تضيف بالـ <head> أيضاً سكربت AdSense الرئيسي (يوصلك بالإيميل عند الموافقة):
                <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
            -->
        </div>
        <div class="footer-links">
            <a href="/privacy.html">Privacy Policy</a> · <a href="/terms.html">Terms of Service</a>
        </div>
    </footer>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="/js/main.js"></script>
</body>
</html>
